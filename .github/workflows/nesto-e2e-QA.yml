name: Nesto E2E QA

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  e2e:
    environment: QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CYPRESS_BASE_URL: ${{ vars.CYPRESS_BASE_URL }}
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init repo
          git -C repo remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C repo -c http.extraheader="AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_REF"
          git -C repo checkout --detach FETCH_HEAD
      - name: Check Node.js version
        run: node --version
      - name: Install dependencies
        working-directory: repo
        run: npm ci
      - name: Typecheck
        working-directory: repo
        run: npm run typecheck
      - name: Run Cypress
        working-directory: repo
        continue-on-error: true
        run: npm run cy:run
